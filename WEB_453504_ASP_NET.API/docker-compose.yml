services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
    - "8080:8080"
    networks:
    - postgres_network
    depends_on:
    - postgres
    restart: unless-stopped

  postgres:
    image: postgres:18.4-bookworm
    container_name: postgres
    env_file:
    - postgres.env
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql
    - ${PG_SCRIPTS_DIR}:/docker-entrypoint-initdb.d:ro
    networks:
      - shared
      - default
      - postgres_network
  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin4
    env_file:
    - postgres.env
    ports:
    - "5454:5454"
    networks:
      - shared
      - default 
    depends_on:
    - postgres
volumes:
  postgres_data:
    driver: local
networks:
  shared:
  postgres_network:
      driver: bridge