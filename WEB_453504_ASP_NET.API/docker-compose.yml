services:
  postgres:
    image: postgres:18.4-bookworm
    container_name: postgres
    env_file:
    - postgres.env
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql
    networks:
      - shared
      - default 
  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin4
    env_file:
    - postgres.env
    ports:
    - "5454:5454"
    networks:
      - shared
      - default 
    depends_on:
    - postgres
volumes:
  postgres_data:
    driver: local
networks:
  shared:
  postgres_network:
      driver: bridge
      external: true